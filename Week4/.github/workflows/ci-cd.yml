name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week4/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Week4/app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run automated tests
        run: npm test

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week4/app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Week4/app/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production application
        run: npm run build

  docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Week4/app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/streamflix-clone:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/streamflix-clone:${{ github.sha }}
          build-args: |
            VITE_TMDB_API_KEY=${{ secrets.VITE_TMDB_API_KEY }}
